services:
  unified-addon:
    build: .
    container_name: bitchord-unified-addon
    restart: unless-stopped
    ports:
      - "8100:8000"
    environment:
      - PORT=8000
      # Public URL where BitChord will access this service (HTTPS required for Android)
      - PUBLIC_HOST=${PUBLIC_HOST:-https://addon.yourdomain.com}
      # Secret key protecting your endpoints from crawlers and bots
      - ACCESS_TOKEN=${ACCESS_TOKEN:-}
      # Your Deezer ARL token (64 hexadecimal characters)
      - DEEZER_ARL=${DEEZER_ARL:-}
      # Optional: point to local Tidal hifi-api instance if running
      - TIDAL_API_URL=${TIDAL_API_URL:-}
      - PREFERRED_PROVIDER=deezer
      - ENABLE_FALLBACK=false

  # Upstream Tidal API engine (optional: uncomment when hifi-api is cloned)
